name: Signed SageMath APT repository
on:
  push:
  schedule:
    - cron: '37 13 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sage-kali-apt
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ vars.SAGE_BUILD_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 360
    container:
      image: &kali-image kalilinux/kali-rolling@sha256:73915d5d54833d498f52fd200960126be4a2dbdcc110d75d70839c4ef155ed03
      options: --platform linux/amd64
    env:
      KALI_IMAGE_DIGEST: *kali-image
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build Sage packages, source, and documentation
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: bash build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages
          path: out/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: build-logs
          path: |
            .work/build/build.log
            .work/build/sagemath/source/logs/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: true

  sign:
    needs: build
    runs-on: ubuntu-26.04
    environment: apt-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends reprepro gnupg
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packages
          path: out
      - name: Verify installation on fresh Kali
        env:
          KALI_IMAGE_DIGEST: *kali-image
        run: |
          docker run --rm --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE/out:/packages:ro" \
            --env DEBIAN_FRONTEND=noninteractive \
            "$KALI_IMAGE_DIGEST" bash -euc '
              apt-get update
              apt-get install -y --no-install-recommends /packages/*.deb
            '
      - name: Create and sign a fresh APT site
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          APT_SIGNING_FINGERPRINT: ${{ vars.APT_SIGNING_FINGERPRINT }}
        run: bash publish.sh
      - name: Package the signed public site for Pages
        run: tar --dereference --hard-dereference -cf .work/artifact.tar -C .work/site .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: .work/artifact.tar
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: true


  deploy:
    needs: sign
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
